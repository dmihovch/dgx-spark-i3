# i3status configuration  ·  ~/.config/i3status/config
general {
    colors      = true
    interval    = 5
    markup      = pango
    color_good     = "#b5bd68"
    color_degraded = "#f0c674"
    color_bad      = "#cc6666"
}

order += "wireless _first_"
order += "ethernet _first_"
order += "disk /"
order += "load"
order += "memory"
order += "cpu_temperature 0"
order += "tztime local"

wireless _first_ {
    format_up   = "  %essid %quality"
    format_down = "  wifi down"
}

ethernet _first_ {
    format_up   = "  %ip"
    format_down = "  eth down"
}

disk "/" {
    format = "  %avail free"
}

load {
    format = "  load %1min"
}

memory {
    format = "  mem %used/%total"
}

cpu_temperature 0 {
    format = "  %degrees°C"
    max_threshold = 95
}

tztime local {
    format = "%a %Y-%m-%d  %H:%M:%S"
}
