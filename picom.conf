# Minimal picom compositor config  ·  ~/.config/picom/picom.conf
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.40;
shadow-offset-x = -12;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.06;

inactive-opacity = 0.95;
frame-opacity = 1.0;

# Ignore shadows on these (adjust as you like)
shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'slop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];
